# DNS-N02: /etc/dnsmasq.conf
# Procedencia: directivas visibles en Explicación i Capturas-2.pdf, página 5.
# No es una copia descargada del archivo actual de la VM.

# Interfaz de red
interface=enp1s0
bind-interfaces

# Servidor DNS
no-resolv
server=1.1.1.1
host-record=R-NCC,R,192.168.20.1

# Servidor DHCP
dhcp-range=192.168.20.100,192.168.20.150,12h
dhcp-option=option:router,192.168.20.1
dhcp-option=option:dns-server,192.168.20.10
