# PROPUESTA. Pendiente de contraste y aplicación en la VM.
# Destino previsto: DNS-N02, /etc/dnsmasq.conf.
# Añade R-N02 al registro de la captura y conserva R-NCC y R.
# Esta variante sustituye a la original; no deben cargarse las dos a la vez.

# Interfaz de red
interface=enp1s0
bind-interfaces

# Servidor DNS
no-resolv
server=1.1.1.1
host-record=R-N02,R-NCC,R,192.168.20.1

# Servidor DHCP
dhcp-range=192.168.20.100,192.168.20.150,12h
dhcp-option=option:router,192.168.20.1
dhcp-option=option:dns-server,192.168.20.10
