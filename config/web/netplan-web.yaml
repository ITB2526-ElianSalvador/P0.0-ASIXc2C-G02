# W-N02: /etc/netplan/00-installer-config.yaml.
# Procedencia: directivas activas visibles en la captura del servidor web.
# Se ordena version al inicio sin modificar los valores observados.
# Pendiente de contraste con todos los archivos efectivos de la VM.
network:
  version: 2
  ethernets:
    enp1s0:
      dhcp4: false
      addresses: [192.168.10.10/24]
      routes:
        - to: default
          via: 192.168.10.1
      nameservers:
        addresses: [1.1.1.1]
